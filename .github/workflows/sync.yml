name: Sync to Hugging Face

on:
  push:
    branches: [main]
  # Allows manual triggering
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces Hub via Python SDK
        run: |
          pip install huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          repo_id = 'vedika24/neuro-symbolic-compliance-api'
          token = os.environ.get('HF_TOKEN')
          
          # 1. Upload backend folder
          print('Uploading backend/ folder...')
          api.upload_folder(
              folder_path='backend',
              path_in_repo='backend',
              repo_id=repo_id,
              repo_type='space',
              token=token
          )
          
          # 2. Upload key root files
          files_to_upload = ['Dockerfile', '.dockerignore', 'test_gemini.py', 'list_models.py']
          for f in files_to_upload:
              print(f'Uploading {f}...')
              api.upload_file(
                  path_or_fileobj=f,
                  path_in_repo=f,
                  repo_id=repo_id,
                  repo_type='space',
                  token=token
              )
          print('Sync complete!')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
