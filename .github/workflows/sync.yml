name: Sync to Hugging Face

on:
  push:
    branches: [main]
  # Allows manual triggering
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push directly to Hugging Face repository using write-access Token
          git push --force https://vedika24:$HF_TOKEN@huggingface.co/spaces/vedika24/neuro-symbolic-compliance-api main
