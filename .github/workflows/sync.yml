name: Sync to Hugging Face

on:
  push:
    branches: [main]
  # Allows manual triggering
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces Hub via Git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a clean deployment directory
          mkdir -p deploy_hf
          cp -r backend deploy_hf/
          cp Dockerfile deploy_hf/
          cp .dockerignore deploy_hf/
          cp test_gemini.py deploy_hf/
          cp list_models.py deploy_hf/
          
          # Create the required Hugging Face configuration README.md
          cat <<EOF > deploy_hf/README.md
---
title: Neuro-Symbolic Compliance API
emoji: 🛡️
colorFrom: cyan
colorTo: blue
sdk: docker
app_port: 7860
pinned: false
---

# Neuro-Symbolic Compliance API
Backend FastAPI verification service using Gemini and Z3 SMT Solver.
EOF
          
          # Initialize fresh git repository inside deployment folder
          cd deploy_hf
          git init
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git checkout -b main
          git add .
          git commit -m "sync: deploy backend API code with metadata"
          
          # Force push only the backend code to Hugging Face Space
          git remote add hf https://vedika24:$HF_TOKEN@huggingface.co/spaces/vedika24/neuro-symbolic-compliance-api
          git push --force hf main



