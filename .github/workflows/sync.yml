name: Sync to Hugging Face

on:
  push:
    branches: [main]
  # Allows manual triggering
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push directly to Hugging Face repository using write-access Token
          # NOTE: Replace 'YOUR_HF_USERNAME' and 'YOUR_SPACE_NAME' with your actual values if they differ.
          git push --force https://VedikaAgrawal:$HF_TOKEN@huggingface.co/spaces/VedikaAgrawal/neuro-symbolic-compliance-api main
